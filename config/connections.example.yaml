# Example connections file — copy to connections.yaml and adapt.
#
# Semantics live with the project (metric-runtime.yaml).
# Connections live with the environment (this file).
#
# Each connection's `type` selects an adapter (built-in: postgres, duckdb,
# memory, webhook; others install as packages, e.g. metric-runtime-snowflake).
#
# Roles per profile:
#   metric_source  — business data the metrics are calculated from (read-only)
#   runtime_store  — where metric-runtime keeps its conclusions: observations,
#                    metric state, evaluations, incidents, notification outbox
#                    (`state_store` is accepted as a deprecated alias)
#   notifier       — delivers outbox events (default: logging)
#
# DO NOT commit real credentials. Prefer environment-variable placeholders;
# a missing variable only fails when a profile actually uses that connection.

connections:
  # The common case: ONE connection serves both roles. Business data is read
  # from source_schema; Metric Runtime writes to runtime_schema. Apply the
  # runtime schema with:  metric-runtime store migrate --profile production
  warehouse:
    type: postgres
    dsn: ${DATABASE_URL}
    # Alternatively: host / port / database / user / password / sslmode
    source_schema: analytics
    fact_table: facts              # resolved in source_schema unless qualified
    timestamp_column: ts
    statement_timeout: 30s
    runtime_schema: metric_runtime # must differ from the source schema
    claim_ttl: 15m                 # crashed workers' evaluation claims expire after this

  # Local analytical source for development.
  local_analytics:
    type: duckdb
    path: ./examples/pypizza/data/pypizza.duckdb
    fact_table: pypizza_halfhourly
    read_only: true

  # A separate operational database as runtime store (split-platform setups).
  ops_db:
    type: postgres
    host: ${RUNTIME_DB_HOST}
    port: 5432
    database: metric_runtime
    user: ${RUNTIME_DB_USER}
    password: ${RUNTIME_DB_PASSWORD}
    sslmode: require
    runtime_schema: metric_runtime

  # Outbox delivery: one JSON POST per event, Idempotency-Key = event_key.
  ops_webhook:
    type: webhook
    url: ${METRIC_RUNTIME_WEBHOOK_URL}
    secret: ${METRIC_RUNTIME_WEBHOOK_SECRET}  # optional HMAC-SHA256 signature
    timeout: 10
    # headers:
    #   Authorization: Bearer ${WEBHOOK_TOKEN}

  # --- External adapters (install the adapter package first) ---
  # snowflake_warehouse:
  #   type: snowflake              # pip install metric-runtime-snowflake
  #   account: ${SNOWFLAKE_ACCOUNT}
  #   ...

profiles:
  production:
    metric_source: warehouse
    runtime_store: warehouse
    notifier: ops_webhook

  local:
    metric_source: local_analytics
    runtime_store:
      type: memory

  # Split platforms: local DuckDB source, durable Postgres runtime store.
  split:
    metric_source: local_analytics
    runtime_store: ops_db
