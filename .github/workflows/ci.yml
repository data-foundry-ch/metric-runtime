name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[demo,dev]"

      - name: Lint
        run: |
          ruff check src tests examples/pypizza
          ruff format --check src tests examples/pypizza

      - name: Type check
        run: mypy src/metric_runtime

      - name: Generate PyPizza data
        run: python examples/pypizza/generate_data.py

      - name: Test
        run: pytest -q

      - name: Import smoke
        run: |
          python -c "import metric_runtime; from metric_runtime import KPI, KPICatalog, KPIEngine; print(metric_runtime.__version__)"

      - name: CLI validate (no DB connect beyond local file existence)
        run: |
          metric-runtime validate \
            --project-config examples/pypizza/metric-runtime.yaml \
            --connections examples/pypizza/connections.yaml \
            --profile local
