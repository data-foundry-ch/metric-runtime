# PyPizza demo profiles.
#   local:      DuckDB source + in-memory runtime store (no credentials).
#   production: DuckDB source + durable Postgres runtime store (split platforms:
#               the demo data ships as a DuckDB file).
#               export METRIC_RUNTIME_POSTGRES_DSN=postgresql://user:pass@host:5432/db
connections:
  pypizza:
    type: duckdb
    path: ./data/pypizza.duckdb
    fact_table: pypizza_halfhourly
    read_only: true

  runtime_db:
    type: postgres
    dsn: ${METRIC_RUNTIME_POSTGRES_DSN}
    runtime_schema: metric_runtime

profiles:
  local:
    metric_source: pypizza
    runtime_store:
      type: memory

  production:
    metric_source: pypizza
    runtime_store: runtime_db
