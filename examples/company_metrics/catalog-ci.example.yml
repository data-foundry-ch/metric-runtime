# .github/workflows/catalog-ci.example.yml
# Copy into a metrics repository to validate the semantic catalog offline.
name: metric-catalog
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install metric-runtime
      - run: metric-runtime validate --project-config metric-runtime.yaml
      - run: metric-runtime catalog export --format json --output catalog.json
